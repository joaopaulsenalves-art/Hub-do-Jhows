<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <title>HUB JHOWS</title>
</head>

<body>

  <nav class="navbar" data-bs-theme="dark">
    <div class="container-fluid" style="display: flex; align-items: center; justify-content: space-between;">
      <a class="navbar-brand" href="index.html" style="font-size: 30pt;">Hub do Jhows</a>

      <!-- Preenchido pelo JavaScript: Entrar / Criar conta  ou  Olá, nome / Sair -->
      <div id="area-usuario" style="display: flex; align-items: center; gap: 12px;"></div>
    </div>
  </nav><br><br>

  <aside>
    <div class="container">
      <h1 class="titulo">
        JOGOS:
      </h1>
    </div>
    <div class="jogos">

      <div class="container">
        <div class=" container-jogo">
          <img src="grau.png" alt="moto">
        </div>
        <button>
          <a href="https://joaopaulsenalves-art.github.io/Moto-Art-Grau/">Jogar</a>
        </button>
      </div>

      <div class="container">
        <div class=" container-jogo">
          <img src="labirint.png" alt="labirinto">
        </div>
        <button>
          <a href="https://joaopaulsenalves-art.github.io/Labirinto-game/">Jogar</a>
        </button>
      </div>

      <div class="container">
        <div class=" container-jogo">
          <img src="snake.png" alt="cobra">
        </div>
        <button>
          <a href="https://joaopaulsenalves-art.github.io/OldSnakeGame/">Jogar</a>
        </button>
      </div>
    </div>
  </aside>

  <script type="module">
    import { sb, sair, usuarioAtual } from './supabase-client.js';

    const area = document.getElementById('area-usuario');

    function criarLink(texto, href) {
      const a = document.createElement('a');
      a.className = 'btn-solid theme-accent';
      a.href = href;
      a.textContent = texto;
      return a;
    }

    async function atualizarBarra() {
      const user = await usuarioAtual();
      area.replaceChildren();

      // Visitante: botões de entrar e criar conta
      if (!user) {
        area.append(criarLink('Entrar', 'login.html'), criarLink('Criar conta', 'cadastro.html'));
        return;
      }

      // Logado: busca o nome de usuário no perfil (com reserva nos metadados)
      let nome = user.user_metadata?.username || 'jogador';
      try {
        const { data } = await sb.from('profiles').select('username').eq('id', user.id).maybeSingle();
        if (data?.username) nome = data.username;
      } catch (e) { /* mantém o nome da reserva */ }

      const saudacao = document.createElement('span');
      saudacao.textContent = 'Olá, ' + nome;      // textContent: seguro contra HTML injetado
      saudacao.style.color = '#fff';

      const btnSair = document.createElement('button');
      btnSair.type = 'button';
      btnSair.className = 'btn-solid theme-accent';
      btnSair.textContent = 'Sair';
      btnSair.addEventListener('click', async () => {
        btnSair.disabled = true;
        await sair();
      });

      area.append(saudacao, btnSair);
    }

    atualizarBarra();

    // Atualiza a barra quando o login ou logout acontecer
    sb.auth.onAuthStateChange((evento) => {
      if (evento === 'SIGNED_IN' || evento === 'SIGNED_OUT') {
        setTimeout(atualizarBarra, 0);
      }
    });
  </script>

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
</body>

</html>
