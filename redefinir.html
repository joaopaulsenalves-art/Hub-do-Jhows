<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #12131a; color: #eee;
    }
    .card {
      width: min(92vw, 380px); padding: 28px; border-radius: 14px;
      background: #1c1e2a; box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 6px; font-size: 1.3rem; }
    p.sub { margin: 0 0 18px; color: #aaa; font-size: .9rem; }
    label { display: block; margin: 12px 0 4px; font-size: .85rem; color: #ccc; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #343748; background: #12131a; color: #eee; font-size: 1rem;
    }
    button {
      width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px;
      background: #6c5ce7; color: #fff; font-size: 1rem; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #msg { margin-top: 14px; font-size: .9rem; min-height: 1.2em; }
    #msg.erro { color: #ff7675; }
    #msg.ok { color: #55efc4; }
    a { color: #a29bfe; }
    .oculto { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Redefinir senha</h1>
    <p class="sub" id="sub">Verificando seu link...</p>

    <form id="form" class="oculto" novalidate>
      <label for="senha">Nova senha</label>
      <input id="senha" type="password" minlength="8" autocomplete="new-password" required>

      <label for="senha2">Confirmar nova senha</label>
      <input id="senha2" type="password" minlength="8" autocomplete="new-password" required>

      <button id="btn" type="submit">Salvar nova senha</button>
    </form>

    <div id="msg" role="status"></div>
    <p><a href="index.html">Voltar ao hub</a></p>
  </main>

  <!-- Biblioteca do Supabase (precisa vir antes do supabase-client.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { sb } from './supabase-client.js';

    const form = document.getElementById('form');
    const sub = document.getElementById('sub');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    function mostrar(texto, tipo = '') {
      msg.textContent = texto;
      msg.className = tipo;
    }

    function liberarFormulario() {
      sub.textContent = 'Escolha uma nova senha com no mínimo 8 caracteres.';
      form.classList.remove('oculto');
    }

    // O supabase-js lê o link do e-mail e dispara este evento
    sb.auth.onAuthStateChange((evento) => {
      if (evento === 'PASSWORD_RECOVERY') liberarFormulario();
    });

    // Se o link for inválido ou expirado, avisa depois de alguns segundos
    setTimeout(async () => {
      if (form.classList.contains('oculto')) {
        const { data } = await sb.auth.getSession();
        if (data.session) {
          liberarFormulario();
        } else {
          sub.textContent = 'Link inválido ou expirado.';
          mostrar('Peça um novo link de redefinição na tela de login.', 'erro');
        }
      }
    }, 3000);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const senha = document.getElementById('senha').value;
      const senha2 = document.getElementById('senha2').value;

      if (senha.length < 8) return mostrar('A senha precisa ter no mínimo 8 caracteres.', 'erro');
      if (senha !== senha2) return mostrar('As senhas não são iguais.', 'erro');

      btn.disabled = true;
      mostrar('Salvando...');

      const { error } = await sb.auth.updateUser({ password: senha });

      if (error) {
        btn.disabled = false;
        return mostrar('Não foi possível salvar: ' + error.message, 'erro');
      }

      mostrar('Senha alterada com sucesso! Redirecionando...', 'ok');
      await sb.auth.signOut();
      setTimeout(() => { window.location.href = 'index.html'; }, 2000);
    });
  </script>
</body>
</html>
