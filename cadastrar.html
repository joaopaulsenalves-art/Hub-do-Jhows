<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Criar conta - HUB JHOWS</title>
</head>

<body>

    <nav class="navbar" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html" style="font-size: 30pt;">Hub do Jhows</a>
        </div>
    </nav><br><br>

    <aside>
        <form id="form-cadastro" novalidate>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome de usuário</label>
                <input type="text" class="form-control" id="nome" placeholder="Adicione seu nome"
                    minlength="3" maxlength="20" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" placeholder="Adicione uma senha"
                    minlength="8" autocomplete="new-password" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="Adicione seu e-mail"
                    autocomplete="email" required>
            </div>
            <button type="submit" id="btn-enviar" class="btn-solid theme-accent">Enviar</button>
            <p id="mensagem" role="status" style="margin-top: 12px;"></p>
        </form>
    </aside>

    <script type="module">
        import { cadastrar } from './supabase-client.js';

        const form = document.getElementById('form-cadastro');
        const btn = document.getElementById('btn-enviar');
        const mensagem = document.getElementById('mensagem');

        function mostrar(texto, tipo) {
            mensagem.textContent = texto;               // textContent: seguro contra HTML injetado
            mensagem.style.color = tipo === 'erro' ? '#ff7675' : '#55efc4';
        }

        function traduzirErro(erro) {
            const m = (erro.message || '').toLowerCase();
            if (m.includes('already registered')) return 'Este e-mail já está cadastrado.';
            if (m.includes('database error')) return 'Esse nome de usuário já está em uso. Escolha outro.';
            if (m.includes('password')) return 'Senha inválida. Use no mínimo 8 caracteres.';
            if (m.includes('rate limit') || m.includes('too many')) return 'Muitas tentativas. Aguarde alguns minutos.';
            if (m.includes('invalid') && m.includes('email')) return 'E-mail inválido.';
            return 'Não foi possível criar a conta. Tente novamente.';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const senha = document.getElementById('senha').value;
            const email = document.getElementById('email').value.trim();

            // Validação no navegador (o banco também valida)
            if (nome.length < 3 || nome.length > 20) {
                return mostrar('O nome deve ter entre 3 e 20 caracteres.', 'erro');
            }
            if (!/^[\p{L}\p{N}_.-]+$/u.test(nome)) {
                return mostrar('Use só letras, números, ponto, hífen ou underline no nome.', 'erro');
            }
            if (!email || !email.includes('@')) {
                return mostrar('Digite um e-mail válido.', 'erro');
            }
            if (senha.length < 8) {
                return mostrar('A senha precisa ter no mínimo 8 caracteres.', 'erro');
            }

            btn.disabled = true;
            mostrar('Criando sua conta...', 'ok');

            try {
                const dados = await cadastrar(email, senha, nome);

                // Com confirmação de e-mail ligada, o Supabase devolve um usuário
                // sem identidades quando o e-mail já existe.
                if (dados.user && dados.user.identities && dados.user.identities.length === 0) {
                    btn.disabled = false;
                    return mostrar('Este e-mail já está cadastrado.', 'erro');
                }

                if (dados.session) {
                    // Confirmação de e-mail desligada: já está logado
                    mostrar('Conta criada! Redirecionando...', 'ok');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    // Confirmação de e-mail ligada: precisa clicar no link
                    mostrar('Conta criada! Confirme seu e-mail pelo link que enviamos para ' + email + '.', 'ok');
                    form.reset();
                    btn.disabled = false;
                }
            } catch (erro) {
                btn.disabled = false;
                mostrar(traduzirErro(erro), 'erro');
                console.error('ERRO DO CADASTRO:', erro);
            }
        });
    </script>
</body>

</html>
